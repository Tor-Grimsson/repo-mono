<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicons/favicon-metrics.svg" />
    <!-- ADD TO HOME SCREEN (2026-10-09, media's shape): kol-icons identity/metrics at the KOL app-icon
         size, dark ground linked (iOS darkens a light web-clip ground). Status bar `black-translucent` +
         `viewport-fit=cover`, with the safe-area padding in src/index.css (media's shape). -->
    <link rel="apple-touch-icon" href="/touch-icons/apple-touch-icon-dark.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Metrics" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAFAFA" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121215" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Metrics — Kolkrabbi</title>
    <meta name="description" content="Internal dashboard: site traffic, project, infrastructure and session metrics." />

    <script defer src="https://kol-umami.vercel.app/script.js" data-website-id="fcd04534-5dcd-44a3-b7b1-256cbdf49ab9"></script>

    <script>
      // Apply saved theme immediately to prevent flash. New visitors (no saved
      // pref) get NO data-theme, so :root (light) + the prefers-color-scheme
      // block decide — i.e. the site follows the OS. A saved pref pins it.
      // Key is `kol-theme` (the kol-framework ThemeToggle contract).
      (function() {
        const saved = localStorage.getItem('kol-theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.dataset.theme = saved;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
