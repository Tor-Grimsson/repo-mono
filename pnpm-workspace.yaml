packages:
  - 'apps/*'
  - 'packages/*'

# Force a single version of React across the whole workspace (two copies crash React).
# Moved here from package.json's "pnpm" field, which pnpm 10 no longer reads.
overrides:
  react: 19.2.8
  react-dom: 19.2.8

# wrangler's runtime (workerd) has a build script; pnpm 10 refuses it silently
# without this and `wrangler` then fails at first use (apps/media, 2026-10-05).
onlyBuiltDependencies:
  - workerd
